<style>
:root{color-scheme:dark;--bg:#001428;--card:#05343c;--ink:#f6ede4;--muted:#93aab0;--line:#0f4b53;--teal:#7ecbb8;--gold:#e5bd6b;
--ok:#7ecbb8;--ok-bg:#0b4a45;--warn:#e5bd6b;--warn-bg:#4a3d12;--bad:#f2958c;--bad-bg:#4b2326;--info:#8ec5f0;--info-bg:#0f3556;--accent:#7ecbb8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 120px}
.hero{margin:6px 0 18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo{display:inline-block;padding:4px 0;line-height:0}
.logo img{height:72px;width:auto;display:block}
@media(max-width:600px){.logo img{height:48px}}
h1{font-size:64px;line-height:1;margin:0;font-weight:800;letter-spacing:-.035em}
.tag{font-size:26px;font-weight:700;color:var(--teal);margin-top:14px;letter-spacing:-.01em}
.lede{font-size:17px;font-weight:500;max-width:520px;margin:8px 0 10px}
.gold{font-size:13px;font-weight:600;color:var(--gold)}
@media(max-width:600px){h1{font-size:46px}.tag{font-size:21px}}
.sub{color:var(--muted);margin:0 0 12px;font-size:13px}
.banner{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}.b-info{background:var(--info-bg);color:var(--info)}
.b-gray{background:var(--line);color:var(--muted)}
.strip{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.strip b{color:var(--ink)}
.strip a{color:var(--teal);cursor:pointer;font-weight:600;text-decoration:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.tab{display:flex;flex-direction:column;justify-content:flex-start;flex:1 0 150px;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:400}
.tab .k{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;align-items:center}
.tab .n{font-size:20px;font-weight:700;line-height:1.1}
.tab .a{font-size:12px;color:var(--muted);min-height:18px}
.tab.t-ok{border-top-color:var(--ok)}.tab.t-warn{border-top-color:var(--warn)}.tab.t-info{border-top-color:var(--info)}.tab.t-bad{border-top-color:var(--bad)}
.tab.t-gray{border-top-color:var(--muted)}
.tab[aria-selected=true]{box-shadow:0 0 0 2px var(--teal);background:var(--card)}
.tab{border-radius:12px}
.tab .n{color:var(--teal)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
@media(max-width:700px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:400}
.mode .t{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.mode .b{font-size:19px;font-weight:700;line-height:1.25;margin-top:2px}
.mode .s{font-size:13px;color:var(--muted)}
.mode{border-radius:14px}
.mode .b{color:var(--teal)}
.mode[aria-selected=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.mode[aria-selected=true] .b{color:var(--bg)}
.mode[aria-selected=true] .t,.mode[aria-selected=true] .s{color:var(--bg);opacity:.8}
.draft{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;background:var(--bg)}
.draft label{display:block;font-size:12px;color:var(--muted);margin:6px 0 2px}
.draft input[type=text],.draft input[type=email],.draft textarea{width:100%;font:inherit;font-size:14px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.draft textarea{min-height:190px;resize:vertical;line-height:1.45}
.draft .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
h3.sec{font-size:15px;margin:22px 0 8px}
#chatbtn{position:fixed;right:16px;bottom:84px;z-index:20;border-radius:999px;padding:12px 20px;box-shadow:0 4px 16px rgba(0,0,0,.22)}
#chat{position:fixed;right:16px;bottom:84px;z-index:30;width:400px;max-width:calc(100vw - 24px);height:min(620px,calc(100vh - 110px));display:none;flex-direction:column;
  background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.28);overflow:hidden}
#chat.open{display:flex}
#chat header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
#chat header b{font-size:15px}
#chat .msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--bg)}
.msg.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.msg .via{display:block;margin-top:6px;font-size:11px;color:var(--muted);white-space:normal}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{font-weight:500;font-size:12px;padding:5px 10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:999px}
#chat form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
#chat input{flex:1;font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#chat .small{font-size:11px;color:var(--muted);padding:0 14px 8px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
select{font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.blurb{color:var(--muted);font-size:13px;margin:0 0 12px}
h2{font-size:14px;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
h2 .count{color:var(--muted);font-weight:400}
h2 .why{color:var(--muted);font-weight:400;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:26px 1fr auto;gap:10px}
.card.c-pay{border-left-color:var(--ok)}.card.c-hold,.card.c-needs_info{border-left-color:var(--warn)}
.card.c-mark_paid{border-left-color:var(--info)}.card.c-reject_duplicate{border-left-color:var(--bad)}
.card.done{opacity:.6}.card.flash{animation:fl 1.6s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--info)}100%{box-shadow:0 0 0 0 transparent}}
.card .chk{padding-top:3px}
.card input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.payee{font-weight:700;font-size:16px}
.meta{color:var(--muted);font-size:13px}
.head{margin:3px 0 6px;font-weight:500}
.amt{font-weight:700;font-size:18px;color:var(--ink);text-align:right;white-space:nowrap}
.right{text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11px;border-radius:6px;padding:1px 7px;font-weight:600;cursor:help}
.evid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;margin:8px 0 4px}
.evid .box{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;background:var(--bg)}
.evid .box .lab{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.evid .box .val{font-weight:600}
.evid .eq{align-self:center;font-size:18px;color:var(--muted)}
@media(max-width:620px){.evid{grid-template-columns:1fr}.evid .eq{display:none}.card{grid-template-columns:24px 1fr}.card .right{grid-column:2;text-align:left}}
.link{color:var(--teal);cursor:pointer;font-size:13px;font-weight:600;background:none;border:0;padding:0}
details{margin-top:6px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
ul{margin:6px 0 6px 18px;padding:0}
.next{font-size:13px;margin-top:4px}
.override{font-size:12px;color:var(--warn);margin-top:6px}
.result{font-size:13px;color:var(--ok);margin-top:6px}
#bar{position:fixed;left:0;right:0;bottom:0;background:#021f2a;border-top:1px solid var(--line);padding:10px 16px}
#bar .in{max-width:980px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--accent);color:var(--bg)}
button:disabled{opacity:.35;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.go{background:var(--accent);color:var(--bg)}
button.go.confirm{background:var(--warn);color:var(--bg)}
button.danger{background:var(--bad);color:var(--bg)}
button.go.danger{background:var(--bad)}
button.go.danger.confirm{background:var(--gold);color:var(--bg)}
.tab{font-weight:400}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
.empty{color:var(--muted);font-size:13px;padding:20px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:19px;font-weight:700;color:var(--teal);margin-top:4px;word-break:break-word;line-height:1.3}
.stat .n{font-size:13px;color:var(--muted)}
.fc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.fc svg{width:100%;height:auto;display:block}
.fc .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 2px}
.fc .legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
.fc .notes{font-size:12px;color:var(--muted);margin:8px 0 0 16px}
.num{text-align:right;white-space:nowrap}
.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
@media(max-width:700px){.grid5{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

function h(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k==="class") e.className=v; else if (k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if (k.startsWith("aria-")) e.setAttribute(k,String(!!v));
    else if (v!==null && v!==undefined && v!==false) e.setAttribute(k,v===true?"":v);
  }
  for (const k of kids.flat()) if (k!==null && k!==undefined && k!==false) e.append(k.nodeType?k:document.createTextNode(k));
  return e;
}
function totals(items){
  const t = {}; items.forEach(i=>t[i.currency]=(t[i.currency]||0)+i.amount);
  return Object.entries(t).sort((a,b)=>(a[0]!=="GBP")-(b[0]!=="GBP")||a[0].localeCompare(b[0])).map(([c,v])=>money(v,c)).join(" + ")||"—";
}

const NS = "http://www.w3.org/2000/svg";
function svg(tag, attrs={}, ...kids){

  kids.forEach(k=>e.append(k.nodeType?k:document.createTextNode(k)));

}

function chart(F){
  const W=720,H=260,L=64,R=14,T=14,B=30, pts=F.timeline;
  const lo = Math.min(...pts.map(p=>Math.min(p.no_income,p.stress,p.projected))), hi = Math.max(...pts.map(p=>Math.max(p.projected,p.no_income)));
  const pad=(hi-lo)*0.08||1, y0=lo-pad, y1=hi+pad;
  const x = i=>L+(W-L-R)*i/(pts.length-1), y = v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));
  const line = (k,color,dash)=>svg("polyline",{points:pts.map((p,i)=>`${x(i)},${y(p[k])}`).join(" "),fill:"none",stroke:color,"stroke-width":2.5,"stroke-linejoin":"round",...(dash?{"stroke-dasharray":"6 4"}:{})});
  const s = svg("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Projected cash balance over the next 13 weeks"});
  for (let g=0; g<=4; g++){
    const v=y0+(y1-y0)*g/4, yy=y(v);
    s.append(svg("line",{x1:L,x2:W-R,y1:yy,y2:yy,stroke:"var(--line)"}), svg("text",{x:L-8,y:yy+4,"text-anchor":"end","font-size":11,fill:"var(--muted)"},short(v)));
  }
  [0,4,8,13].forEach(i=>{ if (pts[i]) s.append(svg("text",{x:x(i),y:H-8,"text-anchor":i===0?"start":i===13?"end":"middle","font-size":11,fill:"var(--muted)"},pts[i].date.slice(5).split("-").reverse().join("/"))); });
  s.append(line("no_income","var(--muted)",true), line("stress","var(--bad)",true), line("projected","var(--info)",false));
  return s;
}

function box(lab,val,sub){ return h("div",{class:"box"},h("div",{class:"lab"},lab),h("div",{class:"val"},val),h("div",{class:"meta"},sub)); }
function evidence(i){
  const mine = box("This invoice",money(i.amount,i.currency),`${i.reference} · due ${fmtDate(i.due_date)}`);
  const eq = h("div",{class:"eq"},"⇄");
  let f;
  if ((f=flagOf(i,"duplicate_invoice"))){ const o=P.items.find(x=>x.id===f.evidence.primary);
    if (o) return h("div",{},h("div",{class:"evid"},mine,eq,box("Original invoice kept",money(o.amount,o.currency),`${o.reference} · ${o.received_from}`)),
      h("button",{class:"link",onclick:()=>go(TABS.find(t=>t.actions&&t.actions.includes(o.action)).id,o.id)},"See the original →")); }
  if ((f=flagOf(i,"already_paid"))){ const t=f.evidence.transaction;
    return h("div",{class:"evid"},mine,eq,box("Bank payment already made",money(t.amount,t.currency),`${fmtDate(t.date)} · ${t.account==="unknown"?"account unknown":t.account}`)); }
  if ((f=flagOf(i,"payment_queued"))){ const p=f.evidence.payment;
    return h("div",{class:"evid"},mine,eq,box(`Payment already queued (${p.status})`,money(p.amount,p.currency),p.payee+(p.scheduled_date?" · scheduled "+fmtDate(p.scheduled_date):""))); }
  if ((f=flagOf(i,"unallocated_payment"))){ const t=f.evidence.transaction;
    return h("div",{class:"evid"},mine,eq,box("Earlier payment, not tied to an invoice",money(t.amount,t.currency),`${fmtDate(t.date)} · ${t.account==="unknown"?"account unknown":t.account}`)); }
  return null;
}
function tags(i){
  const t=[];
  if (overdue(i)) t.push(h("span",{class:"badge b-bad"},"Overdue"));
  if (flagOf(i,"already_paid")||flagOf(i,"unallocated_payment")) t.push(h("span",{class:"badge b-info"},"↔ bank payment"));
  if (flagOf(i,"duplicate_invoice")) t.push(h("span",{class:"badge b-bad"},"copy of another invoice"));
  if (flagOf(i,"duplicate_source")) t.push(h("span",{class:"badge b-gray"},"has a duplicate copy"));
  if (flagOf(i,"payment_queued")) t.push(h("span",{class:"badge b-warn"},"payment queued"));
  return t;
}

function listPanel(t){
  const items = itemsFor(t).slice().sort(SORTS[SORT]), open = items.filter(i=>APPROVE_AS[i.action]&&!done.has(i.id));
  const el = h("div",{});
  el.append(h("p",{class:"blurb"},t.blurb));
  if (!items.length){ el.append(h("div",{class:"empty"},"Nothing here.")); return el; }
  const bar = h("div",{class:"toolbar"});
  if (t.btn && open.length){
    const label = armed===t.id ? `Confirm: ${open.length} × ${totals(open)}? Click again` : `${t.btn(open.length)} · ${totals(open)}`;
    bar.append(h("button",{class:"go"+(t.danger?" danger":"")+(armed===t.id?" confirm":""),onclick:()=>{
      if (armed!==t.id){ armed=t.id; render(); return; }
      armed=null; approveIds(open.map(i=>i.id)); }},label));
    bar.append(h("button",{class:"ghost",onclick:()=>{ open.forEach(i=>selected.add(i.id)); render(); }},"Select all"));
  }
  bar.append(h("span",{class:"grow"}),h("label",{class:"meta"},"Sort ",
    h("select",{onchange:e=>{SORT=e.target.value;render();}},

  el.append(bar);
  if (t.id==="review"){
    const groups = new Map();
    for (const i of items){
      const code = (TODO.find(([c])=>flagOf(i,c))||[null,"Other: read the reason and decide",""]);
      const key = code[1]; if (!groups.has(key)) groups.set(key,{why:code[2],items:[]}); groups.get(key).items.push(i);
    }
    const order = TODO.map(x=>x[1]);
    [...groups.entries()].sort((a,b)=>(order.indexOf(a[0])+99)%99-(order.indexOf(b[0])+99)%99).forEach(([k,g])=>{
      el.append(h("h2",{},k,h("span",{class:"count"},`(${g.items.length})`),h("span",{class:"why"},g.why)));
      g.items.forEach(i=>el.append(card(i)));
    });
  } else items.forEach(i=>el.append(card(i)));
  return el;
}
const ST = {late:["Overdue","b-bad"],due_soon:["Due soon","b-warn"],on_track:["On track","b-ok"],irregular:["Irregular","b-gray"],one_off:["One-off","b-gray"]};
const store = {get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function recordBadge(c){
  const H = c.history;
  if (!H) return h("span",{class:"meta"},c.n===1?"No history yet":"No pattern");
  return H.late===0 ? h("span",{class:"badge b-ok",title:"Every payment landed on its usual date"},`On time ${H.on_time}/${H.cycles}`)
    : h("span",{class:"badge b-warn",title:`Worst ${H.max_delay} days late`},`Late ${H.late}× of ${H.cycles}`);
}
function draftBox(c){
  const key = c.customer, R = c.reminder;
  const d = DRAFTS[key] || (DRAFTS[key] = {to:store.get("email:"+key),subject:R.subject,body:R.body});
  const to = h("input",{type:"email",placeholder:"customer's accounts email (the MCP does not hold it)",value:d.to,
    oninput:e=>{d.to=e.target.value;store.set("email:"+key,d.to);}});
  const sub = h("input",{type:"text",value:d.subject,oninput:e=>{d.subject=e.target.value;}});
  const body = h("textarea",{oninput:e=>{d.body=e.target.value;}}); body.value = d.body;
  const copy = h("button",{class:"ghost",onclick:async()=>{
    const txt = `To: ${d.to}\nSubject: ${d.subject}\n\n${d.body}`;
    try{ await navigator.clipboard.writeText(txt); copy.textContent="Copied"; }catch(e){ body.select(); copy.textContent="Select and copy"; }
    setTimeout(()=>copy.textContent="Copy email",1600); }},"Copy email");
  const open = h("button",{class:"go",onclick:()=>{
    if (!d.to){ to.focus(); to.style.borderColor="var(--bad)"; return; }
    location.href = `mailto:${encodeURIComponent(d.to)}?subject=${encodeURIComponent(d.subject)}&body=${encodeURIComponent(d.body)}`; }},"Open in email app");
  return h("div",{class:"draft"},
    h("div",{class:"meta"},"Reminder draft. Edit it, then open it in your email app to send. Nothing is sent from this page."),
    h("label",{},"To"),to,h("label",{},"Subject"),sub,h("label",{},"Message"),body,
    h("div",{class:"row"},open,copy));
}
function incomePanel(){
  const I = P.income;
  if (!I) return h("div",{class:"empty"},"No receipts data loaded.");
  const S = I.summary, stat = (k,v,n)=>h("div",{class:"stat"},h("div",{class:"k"},k),h("div",{class:"v"},v),h("div",{class:"n"},n));
  const late = I.customers.filter(c=>c.status==="late");
  const rows = I.customers.map(c=>h("tr",{},
    h("td",{},h("b",{},c.customer),h("div",{class:"meta"},c.cadence_months?`Pays every ${c.cadence_months===1?"month":c.cadence_months+" months"}`:c.n===1?"1 payment":`${c.n} payments`)),
    h("td",{},h("span",{class:"badge "+ST[c.status][1]},ST[c.status][0]+(c.status==="late"?` ${c.days}d`:""))),
    h("td",{},recordBadge(c)),
    h("td",{class:"num"},fmtDate(c.last_date),h("div",{class:"meta"},money(c.last_amount,"GBP"))),
    h("td",{class:"num"},c.next_date&&c.status!=="late"?fmtDate(c.next_date):c.status==="late"?"Was "+fmtDate(c.next_date):"—",c.next_date?h("div",{class:"meta"},money(c.next_amount,"GBP")):null),
    h("td",{class:"num"},money(c.total,"GBP"))));
  return h("div",{},
    h("p",{class:"blurb"},"Money coming in from customers. Overdue means a regular payer has missed its usual payment date."),
    h("div",{class:"grid5"},
      stat("Received, last 30 days",gbp0(S.received_30d),`${gbp0(S.received_90d)} in the last 90 days`),
      stat("Regular income",gbp0(S.recurring_monthly)+"/month",`${I.customers.filter(c=>c.cadence_months&&c.status!=="late").length} customers on a regular cycle`),
      stat("Expected, 13 weeks",gbp0(S.expected_13w),`${S.n_expected} receipts from regular customers`),
      stat("Overdue",S.n_late?gbp0(S.at_risk):"None",S.n_late?`${S.n_late} customer${S.n_late>1?"s":""} missed a payment`:"Everyone is on their usual cycle")),
    h("h3",{class:"sec"},"Overdue: send a reminder",h("span",{class:"count"},` (${late.length})`)),
    late.length ? null : h("div",{class:"empty"},"Nothing overdue."),
    ...late.map(c=>h("div",{class:"card c-hold",style:"display:block",id:"card-"+c.customer},
      h("div",{class:"top"},h("span",{class:"payee"},c.customer),h("span",{class:"badge b-bad"},`Overdue ${c.days} days`),
        h("span",{class:"meta"},`Expected ${fmtDate(c.next_date)} · ${money(c.next_amount,"GBP")}`)),
      h("div",{class:"head"},c.note),
      h("div",{class:"next"},h("b",{},"Past record: "),c.record),
      draftBox(c))),
    h("h3",{class:"sec"},"All customers"),
    h("div",{class:"fc"},h("table",{},h("thead",{},h("tr",{},["Customer","Status","Payment record","Last received","Next expected","Total received"].map((x,i)=>h("th",{class:i>2?"num":""},x)))),h("tbody",{},rows))),
    h("details",{},h("summary",{},"What is and is not known"),h("ul",{class:"notes"},I.notes.concat(["Payment record compares each payment with the date implied by the customer's usual cycle. A payment more than a day after that date counts as late."]).map(n=>h("li",{},n)))));
}
function auditPanel(){
  if (!audit.length) return h("div",{class:"empty"},"Nothing approved yet. Approvals in this demo are dry runs and are logged here.");
  return h("div",{class:"fc"},h("table",{},h("thead",{},h("tr",{},["Time (UTC)","Payee","Decision","Amount","Approver","Reviewer"].map(t=>h("th",{},t)))),
    h("tbody",{},audit.map(a=>h("tr",{},h("td",{},a.ts.replace("T"," ").slice(0,19)),h("td",{},a.payee),h("td",{},AUDIT_LABEL[a.approved_as]||a.approved_as),
      h("td",{},money(a.amount,a.currency)),h("td",{},a.approver),h("td",{},a.reviewed_by))))));
}

function render(){
  renderTop();
  const panel = document.getElementById("panel"), t = TABS.find(x=>x.id===TAB);
  panel.replaceChildren();
  if (MODE==="forecast"){ panel.append(h("div",{id:"forecast-panel"})); renderForecast(); }
  else if (MODE==="ar") panel.append(incomePanel());
  else if (t.id==="audit") panel.append(auditPanel());
  else panel.append(listPanel(t));
  updateBar();
}

const curTab = ()=>TABS.find(x=>x.id===TAB);
const curSel = ()=>{ const tb=curTab(); return MODE==="ap"&&tb.actions&&tb.verb ? itemsFor(tb).filter(i=>selected.has(i.id)&&!done.has(i.id)) : []; };
function updateBar(){
  const tb = curTab(), bar = document.getElementById("bar"), btn = document.getElementById("approve");
  const show = MODE==="ap" && !!(tb.actions && tb.verb);
  bar.style.display = show ? "" : "none";
  if (!show) return;
  const sel = curSel();
  const what = tb.id==="ready" ? (sel.length?` · ${sel.length} payment${sel.length===1?"":"s"} totalling ${totals(sel)}`:"")
    : tb.id==="paid" ? " to reject as already paid" : " to reject as duplicates";
  document.getElementById("barinfo").textContent = sel.length ? `${sel.length} selected${what}` : "Nothing selected: tick invoices above, or use the button at the top";
  btn.textContent = `${tb.verb} selected`;
  btn.className = tb.danger ? "danger" : "";
  btn.disabled = !sel.length;
}

async function approveIds(ids){
  let results;
  if (STATIC){
    results = ids.map(id=>{
      const it = P.items.find(x=>x.id===id), kind = APPROVE_AS[it.action];
      if (!kind) return {id,status:"refused",message:"On hold: needs a human first."};
      const msg = kind==="pay"?`Would pay ${money(it.amount,it.currency)} to ${it.payee} (ref ${it.reference}) from ${it.pay_from}.`
        : kind==="mark_paid"?`Would reject ${it.reference}: already paid, so it is matched to the existing payment and not paid again.`:`Would reject ${it.reference} as a duplicate; the original invoice is kept.`;
      audit.unshift({ts:new Date().toISOString(),payee:it.payee,approved_as:kind,amount:it.amount,currency:it.currency,approver:"demo-user",reviewed_by:it.reviewed_by});
      return {id,status:"dry_run",message:msg};
    });
  } else {
    const r = await fetch("/api/execute",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({approved:ids})});
    results = (await r.json()).results; audit = await (await fetch("/api/audit")).json();
  }
  results.forEach(r=>{ if (r.status==="dry_run"||r.status==="done"){done.set(r.id,r);selected.delete(r.id);} });
  render();
}
document.getElementById("approve").addEventListener("click",()=>approveIds(curSel().map(i=>i.id)));
document.getElementById("clear").addEventListener("click",()=>{curSel().forEach(i=>selected.delete(i.id));render();});

// ---------- chat ----------
const SUGGESTED = ["Why is Remote People held?","Which customers are late?","What is our runway?","Which invoices were already paid?","What have we paid Snowflake?","Which invoices are duplicates?","How much money came in recently?"];
let chatHist = [], chatBusy = false;
function chatAdd(role, text, via){
  const m = document.getElementById("msgs");
  const e = h("div",{class:"msg "+(role==="user"?"u":"a")},text, via?h("span",{class:"via"},via):null);
  m.append(e); m.scrollTop = m.scrollHeight; return e;
}
function chatWelcome(){
  const m = document.getElementById("msgs"); m.replaceChildren();
  chatAdd("assistant","Ask me about the invoices, payment history, customers or cash. I only read the data; I cannot approve, pay or email anything.");
  m.append(h("div",{class:"sugg"},SUGGESTED.map(q=>h("button",{type:"button",onclick:()=>chatSend(q)},q))));
  document.getElementById("chatnote").textContent = STATIC
    ? "Demo page: the suggested questions work offline. Run the app (python3 app.py) for free-text questions, and set ANTHROPIC_API_KEY for open-ended answers."
    : "Answers come from the loaded snapshot. With ANTHROPIC_API_KEY set, Claude queries it with tools; otherwise simple keyword rules answer.";
  document.getElementById("chatq").placeholder = STATIC ? "Pick a suggested question…" : "Ask a question…";
}
async function chatSend(q){
  q = (q||"").trim(); if (!q || chatBusy) return;
  chatBusy = true; chatAdd("user",q); document.getElementById("chatq").value="";
  const wait = chatAdd("assistant","Looking that up…");
  let out;
  try{
    if (STATIC){
      const key = Object.keys(CHAT_CANNED||{}).find(k=>k.toLowerCase().replace(/[?.!]/g,"")===q.toLowerCase().replace(/[?.!]/g,""));
      out = key ? {answer:CHAT_CANNED[key],tools:[],mode:"offline"} :
        {answer:"This demo page only has the suggested questions. Run the app (python3 app.py) to ask anything.",tools:[],mode:"offline"};
    } else {
      const r = await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,history:chatHist.slice(-10)})});
      out = await r.json();
    }
  }catch(e){ out = {answer:"Sorry, I could not reach the server.",tools:[],mode:"offline"}; }
  wait.remove();
  const via = (out.mode==="claude"?"Answered by Claude":"Answered from the data by simple rules")
    + (out.tools&&out.tools.length?" · looked up: "+[...new Set(out.tools.map(t=>t.name))].join(", "):"")
    + (out.note?" · "+out.note:"");
  chatAdd("assistant",out.answer,via);
  chatHist.push({role:"user",content:q},{role:"assistant",content:out.answer});
  chatBusy = false;
}
document.getElementById("chatbtn").addEventListener("click",()=>{
  const c = document.getElementById("chat"); c.classList.add("open"); document.getElementById("chatbtn").style.display="none";
  if (!document.getElementById("msgs").children.length) chatWelcome(); document.getElementById("chatq").focus();
});
document.getElementById("chatclose").addEventListener("click",()=>{
  document.getElementById("chat").classList.remove("open"); document.getElementById("chatbtn").style.display="";
});
document.getElementById("chatform").addEventListener("submit",e=>{ e.preventDefault(); chatSend(document.getElementById("chatq").value); });
document.addEventListener("keydown",e=>{ if (e.key==="Escape") document.getElementById("chatclose").click(); });

(async()=>{
  P = STATIC ? EMBEDDED : await (await fetch("/api/proposal")).json();
  if (!STATIC) audit = await (await fetch("/api/audit")).json();
  render();
})();
</script>
